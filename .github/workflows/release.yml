name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: 3.47.4
          channel: stable
          cache: true

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - run: flutter pub get --enforce-lockfile
      - run: flutter analyze
      - run: flutter test

      # 发布必须使用 repo secrets 中的正式签名密钥。
      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo '::error::Release requires KEYSTORE_BASE64 and KEYSTORE_PASSWORD secrets.'
            exit 1
          fi
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > android/app/zremote-release.jks
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=zremote\nstoreFile=zremote-release.jks\n' \
            "$KEYSTORE_PASSWORD" "$KEYSTORE_PASSWORD" > android/key.properties

      - run: flutter build apk --release

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: zremote-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          generate_release_notes: true
          files: build/app/outputs/flutter-apk/app-release.apk

  # iOS 出未签名 IPA：无 Apple 开发者账号也可分发，用户自行签名侧载
  ipa:
    needs: apk
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: 3.47.4
          channel: stable
          cache: true

      - run: flutter pub get --enforce-lockfile
      - run: flutter build ios --release --no-codesign

      - name: Package unsigned IPA
        run: |
          mkdir -p build/Payload
          cp -R build/ios/iphoneos/Runner.app build/Payload/Runner.app
          ditto -c -k --keepParent build/Payload zremote-ios-unsigned.ipa

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: zremote-ios-unsigned-ipa
          path: zremote-ios-unsigned.ipa

      - name: Attach unsigned IPA to Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          append_body: true
          body: |
            > **iOS 包 `zremote-ios-unsigned.ipa` 为未签名包，无法直接安装。**
            > 请使用 [AltStore](https://altstore.io) / [Sideloadly](https://sideloadly.io) / TrollStore 等工具，
            > 用自己的 Apple ID 签名后侧载（免费账号 7 天需重新签名）。
          files: zremote-ios-unsigned.ipa
